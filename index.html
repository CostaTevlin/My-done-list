<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>My Done List</title>
<meta name="description" content="Track what you accomplished today. A done-list for people who need to see their progress.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Done List">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-startup-image" href="icon-192.png">

<meta name="format-detection" content="telephone=no">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --white: #FFFFFF;
    --off-white: #FAFAFA;
    --border: #D1D1D1;
    --border-light: #E8E8E8;
    --charcoal: #161A14;
    --dark: #32373C;
    --mid: #8A8A87;
    --light: #B8B8B5;
    --danger: #C44;

    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html { height: 100%; overflow: hidden; }

  body {
    height: 100%;
    overflow: hidden;
    background: var(--white);
    font-family: 'Outfit', -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--charcoal);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  #root { height: 100%; }

  .screen {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    scrollbar-width: none;
    background: var(--white);
  }
  .screen::-webkit-scrollbar { display: none; }

  /* Animations */
  @keyframes enter {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes sheet-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes slide-out-left {
    to { transform: translateX(-100%); opacity: 0; }
  }
  @keyframes confetti-pop {
    0% { transform: translateY(0) translateX(0) rotate(0deg) scale(0); opacity: 1; }
    20% { opacity: 1; transform: translateY(-40vh) translateX(calc(var(--drift) * 0.3)) rotate(90deg) scale(1); }
    100% { transform: translateY(-85vh) translateX(var(--drift)) rotate(280deg) scale(0.4); opacity: 0; }
  }

  .reveal {
    opacity: 0;
    animation: enter 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }
  .modal-bg { animation: fade 0.2s ease-out; }
  .modal-sheet { animation: sheet-up 0.4s cubic-bezier(0.2, 0.9, 0.3, 1); }

  /* Item row — swipeable */
  .item-row {
    position: relative;
    overflow: hidden;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .item-inner {
    position: relative;
    z-index: 1;
    background: var(--white);
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  .item-inner:active {
    background: var(--off-white);
  }
  .item-delete-bg {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 13px;
    font-weight: 500;
    background: var(--danger);
  }
  .item-removing {
    animation: slide-out-left 0.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
  }

  /* Pill button */
  .pill-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 9999px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.01em;
    transition: opacity 0.15s ease;
    cursor: pointer;
    border: none;
    outline: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    min-height: 44px;
  }
  .pill-btn:active { opacity: 0.6; }

  /* Type */
  .display {
    font-family: 'Outfit', -apple-system, sans-serif;
    font-weight: 200;
    letter-spacing: -0.05em;
    line-height: 0.9;
    color: var(--charcoal);
  }
  .display-sub {
    font-family: 'Outfit', -apple-system, sans-serif;
    font-weight: 300;
    letter-spacing: -0.01em;
    line-height: 1.4;
    color: var(--mid);
  }
  .num {
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: var(--light);
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
    min-width: 24px;
    flex-shrink: 0;
  }
  .time {
    font-family: 'Outfit', sans-serif;
    font-size: 11px;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    color: var(--light);
    flex-shrink: 0;
  }
  .label {
    font-size: 11px;
    font-weight: 500;
    color: var(--light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* Tab bar — with centered action */
  .tab-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 8px 0;
    padding-bottom: max(8px, var(--sab));
    background: rgba(255,255,255,0.92);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-light);
  }
  .tab-btn {
    background: none;
    border: none;
    padding: 4px 20px;
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s ease;
    position: relative;
    min-height: 44px;
    display: flex;
    align-items: center;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .tab-btn:active { opacity: 0.5; }
  .tab-indicator {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 1.5px;
    background: var(--charcoal);
    border-radius: 1px;
  }

  /* Center FAB in tab bar */
  .tab-center-btn {
    margin: 0 12px;
  }

  /* Input */
  .text-input {
    width: 100%;
    padding: 14px 0;
    font-size: 16px;
    font-family: 'Outfit', sans-serif;
    font-weight: 400;
    color: var(--charcoal);
    border: none;
    border-bottom: 1px solid var(--border);
    outline: none;
    background: transparent;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.15s ease;
  }
  .text-input:focus { border-bottom-color: var(--charcoal); }
  .text-input::placeholder { color: var(--light); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── Persistence ── */
const STORAGE_KEY = 'mydonelist_v2';
const MIN_INPUT_LENGTH = 2;
const MAX_HISTORY_DAYS = 30; // keep 30 days of history

const loadItems = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return parsed.filter(i => i.text && i.text.length >= MIN_INPUT_LENGTH && i.date && i.time);
    }
  } catch {}
  return [];
};

const saveItems = (items) => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch {}
};

// Prune items older than MAX_HISTORY_DAYS
const pruneOld = (items) => {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - MAX_HISTORY_DAYS);
  const cutoffKey = cutoff.toISOString().slice(0, 10);
  return items.filter(i => i.date >= cutoffKey);
};

/* ── Helpers ── */
const pad = (n) => String(n).padStart(2, '0');

const getTime24 = () => {
  const d = new Date();
  return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
};

const parseTime = (t) => {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + (m || 0);
};

const getGreeting = () => {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 17) return 'Good afternoon';
  return 'Good evening';
};

const getTodayKey = () => new Date().toISOString().slice(0, 10);

/* ── Context-aware copy ── */
const getMessage = (count) => {
  // Use hour as additional seed so messages rotate throughout the day
  const h = new Date().getHours();
  const seed = (count * 7 + h) % 5;
  if (count === 0) return '';
  if (count === 1) return [
    'First win of the day. Let\'s go.',
    'And so it begins.',
    'The hardest one is behind you.',
    'That\'s the spark. Keep going.',
    'One down. You\'re officially unstoppable.',
  ][seed];
  if (count === 2) return [
    'Two for two. You\'re warming up.',
    'A pattern is forming.',
    'Twice as productive as zero. Math checks out.',
    'Double trouble (the good kind).',
    'You didn\'t stop at one. Respect.',
  ][seed];
  if (count <= 4) return [
    'You\'re on a roll now.',
    'Small wins stack up fast.',
    'Your future self is already thanking you.',
    'Look at you go.',
    'This is what showing up looks like.',
  ][seed];
  if (count <= 7) return [
    'Okay, you\'re actually crushing it.',
    'Today is listening to you.',
    'You turned "meh" into momentum.',
    'Not bad? No — this is great.',
    'High five. Seriously.',
  ][seed];
  return [
    'Legend status: unlocked.',
    'Your done list has a done list.',
    'Peak productivity. Screenshot this.',
    'You showed up and didn\'t stop.',
    'Tomorrow\'s gonna be jealous of today.',
  ][seed];
};

const getReflectNote = (count) => {
  const h = new Date().getHours();
  const seed = (count * 3 + h) % 4;
  if (count === 0) return [
    'Tomorrow is a fresh start.',
    'Rest is productive too.',
    'Some days are for recharging.',
    'A blank page is still a page.',
  ][seed];
  if (count === 1) return [
    'You showed up. That\'s the whole game.',
    'One thing done is infinitely more than zero.',
    'That one thing? It mattered.',
    'You started. Most people didn\'t.',
  ][seed];
  if (count <= 3) return [
    'Solid day. Every task counted.',
    'Steady wins the race.',
    'You kept going. That\'s the superpower.',
    'Quality over quantity. Always.',
  ][seed];
  if (count <= 6) return [
    'What a day. Be proud of yourself.',
    'You made today count.',
    'This is what a good day looks like.',
    'Impressive. Full stop.',
  ][seed];
  return [
    'An extraordinary day. Feel that.',
    'You were on fire today.',
    'Today was your masterpiece.',
    'Take a bow. You earned it.',
  ][seed];
};

/* ── Swipeable Item ── */
function SwipeItem({ item, index, total, onDelete }) {
  const [offset, setOffset] = useState(0);
  const [removing, setRemoving] = useState(false);
  const startX = useRef(null);
  const currentX = useRef(0);
  const threshold = 80;

  const handleTouchStart = (e) => {
    startX.current = e.touches[0].clientX;
    currentX.current = 0;
  };
  const handleTouchMove = (e) => {
    if (startX.current === null) return;
    const diff = startX.current - e.touches[0].clientX;
    if (diff > 0) {
      currentX.current = Math.min(diff, 100);
      setOffset(currentX.current);
    } else {
      currentX.current = 0;
      setOffset(0);
    }
  };
  const handleTouchEnd = () => {
    if (currentX.current > threshold) {
      setRemoving(true);
      setTimeout(() => onDelete(item.id), 300);
    } else {
      setOffset(0);
    }
    startX.current = null;
    currentX.current = 0;
  };

  // Number from total (latest = total, oldest = 01)
  const displayNum = total - index;

  return (
    <div
      className={`item-row ${removing ? 'item-removing' : ''}`}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      <div className="item-delete-bg">Delete</div>
      <div className="item-inner" style={{ transform: `translateX(${-offset}px)` }}>
        <div style={{
          display: 'flex',
          alignItems: 'baseline',
          gap: 12,
          padding: '16px 0',
          borderBottom: '1px solid var(--border-light)',
        }}>
          <span className="num">{pad(displayNum)}</span>
          <p style={{ flex: 1, fontSize: 15, fontWeight: 400, color: 'var(--charcoal)', lineHeight: 1.45 }}>{item.text}</p>
          <span className="time">{item.time}</span>
        </div>
      </div>
    </div>
  );
}

/* ── Mini confetti ── */
const fireConfetti = () => {
  const colors = ['#161A14', '#8A8A87', '#B8B8B5', '#D1D1D1', '#E8E8E8'];
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;inset:0;z-index:100;pointer-events:none;overflow:hidden';
  document.body.appendChild(container);

  const count = 35;
  for (let i = 0; i < count; i++) {
    const dot = document.createElement('div');
    const size = 4 + Math.random() * 5;
    const x = 30 + Math.random() * 40; // center-ish spread
    const drift = -60 + Math.random() * 120;
    const delay = Math.random() * 200;
    const dur = 700 + Math.random() * 500;
    dot.style.cssText = `
      position:absolute;
      left:${x}%;bottom:0;
      width:${size}px;height:${size}px;
      border-radius:${Math.random() > 0.5 ? '50%' : '1px'};
      background:${colors[i % colors.length]};
      opacity:0;
      animation:confetti-pop ${dur}ms ${delay}ms cubic-bezier(.2,.9,.3,1) forwards;
      --drift:${drift}px;
    `;
    container.appendChild(dot);
  }
  setTimeout(() => container.remove(), 1400);
};

/* ── App ── */
function App() {
  const [allItems, setAllItems] = useState(() => pruneOld(loadItems()));
  const [screen, setScreen] = useState('home');
  const [showModal, setShowModal] = useState(false);
  const [newText, setNewText] = useState('');
  const [todayKey, setTodayKey] = useState(getTodayKey);
  const inputRef = useRef(null);

  // Check for date change every 30s (handles midnight rollover, waking phone next day)
  useEffect(() => {
    const check = setInterval(() => {
      const now = getTodayKey();
      if (now !== todayKey) setTodayKey(now);
    }, 30000);
    return () => clearInterval(check);
  }, [todayKey]);

  // Also check on visibility change (user switches back to app)
  useEffect(() => {
    const onVisible = () => {
      if (document.visibilityState === 'visible') {
        const now = getTodayKey();
        if (now !== todayKey) setTodayKey(now);
      }
    };
    document.addEventListener('visibilitychange', onVisible);
    return () => document.removeEventListener('visibilitychange', onVisible);
  }, [todayKey]);

  // Today's items, sorted latest first
  const items = useMemo(() =>
    allItems
      .filter(i => i.date === todayKey)
      .sort((a, b) => b.id - a.id),
    [allItems, todayKey]
  );

  // Timeline for Reflect — chronological (earliest first)
  const timeline = useMemo(() =>
    allItems
      .filter(i => i.date === todayKey)
      .sort((a, b) => a.id - b.id),
    [allItems, todayKey]
  );

  // Weekly chart data — last 7 days
  const weekData = useMemo(() => {
    const days = [];
    const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = d.toISOString().slice(0, 10);
      const count = allItems.filter(it => it.date === key).length;
      days.push({ key, label: i === 0 ? 'Today' : dayNames[d.getDay()], count });
    }
    return days;
  }, [allItems, todayKey]);

  const isValid = newText.trim().length >= MIN_INPUT_LENGTH;

  // Persist
  useEffect(() => { saveItems(allItems); }, [allItems]);

  const addItem = useCallback(() => {
    if (!isValid) return;
    setAllItems(prev => [...prev, {
      id: Date.now(),
      text: newText.trim(),
      time: getTime24(),
      date: getTodayKey(),
    }]);
    setNewText('');
    setShowModal(false);
    setTimeout(fireConfetti, 250);
  }, [newText, isValid]);

  const removeItem = useCallback((id) => {
    setAllItems(prev => prev.filter(it => it.id !== id));
  }, []);

  useEffect(() => {
    if (showModal && inputRef.current) {
      // Use requestAnimationFrame + short delay to ensure sheet is rendered before focus
      requestAnimationFrame(() => {
        setTimeout(() => {
          inputRef.current?.focus();
        }, 50);
      });
    }
  }, [showModal]);

  const note = getMessage(items.length);
  const contentPad = {
    paddingTop: `calc(20px + var(--sat))`,
    paddingLeft: `max(28px, var(--sal))`,
    paddingRight: `max(28px, var(--sar))`,
    paddingBottom: `calc(100px + var(--sab))`,
  };

  return (
    <div style={{ height: '100%', position: 'relative' }}>

      {/* ── Today — latest first, big count ── */}
      {screen === 'home' && (
        <main className="screen">
          <div style={contentPad}>
            <header className="reveal">
              <p className="label">{getGreeting()}</p>
              <h1 className="display" style={{ fontSize: 44, marginTop: 16, whiteSpace: 'nowrap' }}>
                My done list
              </h1>
            </header>

            <div className="reveal" style={{ marginTop: 40, animationDelay: '80ms' }}>
              <span className="display" style={{ fontSize: 120, display: 'block', lineHeight: '0.82' }}>
                {pad(items.length)}
              </span>
              {note && (
                <p style={{ fontSize: 17, fontWeight: 400, marginTop: 16, maxWidth: 260, lineHeight: 1.45, color: 'var(--dark)', letterSpacing: '-0.01em' }}>
                  {note}
                </p>
              )}
            </div>

            <div className="reveal" style={{ marginTop: 40, borderTop: '1px solid var(--border)', animationDelay: '120ms' }}></div>

            <div role="list" aria-label="Completed tasks" style={{ marginTop: 0 }}>
              {items.map((item, idx) => (
                <div
                  key={item.id}
                  role="listitem"
                  className="reveal"
                  style={{ animationDelay: `${(idx + 2) * 50}ms` }}
                >
                  <SwipeItem item={item} index={idx} total={items.length} onDelete={removeItem} />
                </div>
              ))}

              {items.length === 0 && (
                <div className="reveal" style={{ padding: '60px 0 80px' }}>
                  <p className="display" style={{ fontSize: 28, lineHeight: 1.15, maxWidth: 240 }}>
                    Your day starts here
                  </p>
                  <p style={{ fontSize: 14, color: 'var(--mid)', marginTop: 12, lineHeight: 1.5, maxWidth: 220 }}>
                    What's one thing you've already done today? Even getting out of bed counts.
                  </p>
                  <button
                    className="pill-btn"
                    style={{
                      marginTop: 24,
                      height: 44,
                      padding: '0 24px',
                      background: 'var(--charcoal)',
                      color: 'var(--white)',
                    }}
                    onClick={() => setShowModal(true)}
                  >
                    + Log something
                  </button>
                </div>
              )}
            </div>
          </div>
        </main>
      )}

      {/* ── Reflect — timeline (earliest first), no duplicate big number ── */}
      {screen === 'reflect' && (
        <main className="screen">
          <div style={contentPad}>
            <header className="reveal">
              <p className="label">Reflect</p>
              <h1 className="display" style={{ fontSize: 44, marginTop: 16 }}>
                Your day<br />so far
              </h1>
            </header>

            <div className="reveal" style={{ marginTop: 32, animationDelay: '80ms' }}>
              <p style={{ fontSize: 18, fontWeight: 400, maxWidth: 300, lineHeight: 1.45, color: 'var(--dark)', letterSpacing: '-0.01em' }}>
                {getReflectNote(items.length)}
              </p>
            </div>

            {/* Weekly productivity chart */}
            <div className="reveal" style={{ marginTop: 32, animationDelay: '120ms' }}>
              <p className="label" style={{ marginBottom: 16 }}>This week</p>
              <div style={{
                display: 'flex',
                overflowX: 'auto',
                gap: 10,
                paddingBottom: 4,
                scrollbarWidth: 'none',
                WebkitOverflowScrolling: 'touch',
                msOverflowStyle: 'none',
              }}>
                {weekData.map((day) => {
                  const maxCount = Math.max(...weekData.map(d => d.count), 1);
                  const barHeight = Math.max(day.count > 0 ? (day.count / maxCount) * 100 : 4, 4);
                  const isToday = day.key === todayKey;
                  return (
                    <div key={day.key} style={{
                      display: 'flex',
                      flexDirection: 'column',
                      alignItems: 'center',
                      minWidth: 44,
                      flex: '1 0 44px',
                    }}>
                      <span style={{
                        fontSize: 14,
                        fontWeight: 500,
                        fontVariantNumeric: 'tabular-nums',
                        color: isToday ? 'var(--charcoal)' : day.count > 0 ? 'var(--dark)' : 'var(--light)',
                        marginBottom: 8,
                      }}>
                        {day.count}
                      </span>
                      <div style={{
                        width: 28,
                        height: 120,
                        display: 'flex',
                        alignItems: 'flex-end',
                        borderRadius: 14,
                        background: 'var(--off-white)',
                        overflow: 'hidden',
                      }}>
                        <div style={{
                          width: '100%',
                          height: `${barHeight}%`,
                          background: isToday ? 'var(--charcoal)' : day.count > 0 ? 'var(--border)' : 'transparent',
                          borderRadius: 14,
                          transition: 'height 0.4s cubic-bezier(0.2, 0.9, 0.3, 1)',
                        }} />
                      </div>
                      <span style={{
                        fontSize: 11,
                        fontWeight: isToday ? 600 : 400,
                        color: isToday ? 'var(--charcoal)' : 'var(--light)',
                        marginTop: 8,
                        letterSpacing: '0.02em',
                      }}>
                        {day.label}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="reveal" style={{ marginTop: 32, borderTop: '1px solid var(--border)', animationDelay: '180ms' }}></div>

            {timeline.length > 0 && (
              <div className="reveal" style={{ marginTop: 20, animationDelay: '240ms' }}>
                {timeline.map((item, idx) => (
                  <div key={item.id} style={{
                    display: 'flex',
                    alignItems: 'flex-start',
                    gap: 16,
                    padding: '14px 0',
                    borderBottom: idx < timeline.length - 1 ? '1px solid var(--border-light)' : 'none',
                  }}>
                    <span className="time" style={{ minWidth: 40, paddingTop: 2 }}>{item.time}</span>
                    <span style={{ fontSize: 15, color: 'var(--charcoal)', lineHeight: 1.5 }}>{item.text}</span>
                  </div>
                ))}
                <div style={{ marginTop: 24 }}>
                  <p style={{ fontSize: 13, color: 'var(--light)' }}>
                    {items.length} {items.length === 1 ? 'thing' : 'things'} done today
                  </p>
                </div>
              </div>
            )}

            {timeline.length === 0 && (
              <div className="reveal" style={{ padding: '48px 0', animationDelay: '240ms' }}>
                <p style={{ fontSize: 14, color: 'var(--mid)', lineHeight: 1.5 }}>
                  Nothing to reflect on yet. Go to Today and log your first win.
                </p>
              </div>
            )}

            <div className="reveal" style={{ marginTop: 40, animationDelay: '340ms' }}>
              <p style={{ fontSize: 13, color: 'var(--light)' }}>See you tomorrow</p>
            </div>
          </div>
        </main>
      )}

      {/* ── Bottom sheet ── */}
      {showModal && (
        <div
          className="modal-bg"
          style={{
            position: 'fixed', inset: 0, zIndex: 40,
            display: 'flex', alignItems: 'flex-end',
            background: 'rgba(22,26,20,0.15)',
            WebkitBackdropFilter: 'blur(6px)',
            backdropFilter: 'blur(6px)',
          }}
          onClick={() => setShowModal(false)}
        >
          <div
            className="modal-sheet"
            style={{
              width: '100%',
              background: 'var(--white)',
              borderRadius: '14px 14px 0 0',
              padding: `24px max(28px, var(--sal)) max(24px, var(--sab))`,
              paddingRight: `max(28px, var(--sar))`,
            }}
            onClick={e => e.stopPropagation()}
          >
            <div style={{ width: 36, height: 5, background: 'var(--border)', borderRadius: 3, margin: '0 auto 24px' }}></div>

            <h2 className="display" style={{ fontSize: 24 }}>
              What's one thing you did?
            </h2>
            <p style={{ fontSize: 14, color: 'var(--mid)', marginTop: 8 }}>
              Even something small. It all counts.
            </p>

            <input
              ref={inputRef}
              type="text"
              className="text-input"
              value={newText}
              onChange={e => setNewText(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addItem()}
              placeholder="Took a 10-min walk"
              style={{ marginTop: 20 }}
              enterKeyHint="done"
              autoComplete="off"
              autoCorrect="on"
              spellCheck="true"
              aria-label="What you accomplished"
            />

            <button
              className="pill-btn"
              style={{
                width: '100%',
                marginTop: 24,
                height: 50,
                background: isValid ? 'var(--charcoal)' : 'var(--off-white)',
                color: isValid ? 'var(--white)' : 'var(--light)',
                border: isValid ? 'none' : '1px solid var(--border-light)',
              }}
              onClick={addItem}
              disabled={!isValid}
            >
              Done
            </button>
          </div>
        </div>
      )}

      {/* Tab bar with centered action */}
      <nav className="tab-bar" aria-label="Navigation">
        <button
          className="tab-btn"
          style={{ color: screen === 'home' ? 'var(--charcoal)' : 'var(--light)' }}
          onClick={() => setScreen('home')}
          aria-label="Today"
          aria-current={screen === 'home' ? 'page' : undefined}
        >
          Today
          {screen === 'home' && <span className="tab-indicator" />}
        </button>

        {/* Centered add button */}
        <button
          className="pill-btn tab-center-btn"
          style={{
            height: 48,
            padding: '0 32px',
            background: 'var(--charcoal)',
            color: 'var(--white)',
            fontSize: 15,
            fontWeight: 500,
            letterSpacing: '0.02em',
            boxShadow: '0 2px 12px rgba(22,26,20,0.15)',
          }}
          onClick={() => setShowModal(true)}
          aria-label="Log something you did"
        >
          + Log
        </button>

        <button
          className="tab-btn"
          style={{ color: screen === 'reflect' ? 'var(--charcoal)' : 'var(--light)' }}
          onClick={() => setScreen('reflect')}
          aria-label="Reflect"
          aria-current={screen === 'reflect' ? 'page' : undefined}
        >
          Reflect
          {screen === 'reflect' && <span className="tab-indicator" />}
        </button>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
